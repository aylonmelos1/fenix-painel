name: No comments

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/no-comments-gate]

permissions:
  contents: read

concurrency:
  group: no-comments-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-comments:
    name: no-comments / validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:no-comments
      - run: npm run lint
